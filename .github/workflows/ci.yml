name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: meterflow, POSTGRES_PASSWORD: meterflow, POSTGRES_DB: meterflow}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meterflow" --health-interval 2s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://meterflow:meterflow@localhost:5432/meterflow?sslmode=disable
      REDIS_ADDR: localhost:6379
      JWT_SECRET: ci-secret-that-is-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.24.x", cache: true}
      - run: go mod tidy
      - run: find . -name '*.go' -not -path './.tools/*' -print0 | xargs -0 gofmt -w && git diff --exit-code
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run ./cmd/meterflow migrate
      - run: go test -tags=integration -count=1 ./...
      - run: docker build -t meterflow:${{ github.sha }} .
